name: test

# Hosted runners only. The integration test needs NetworkManager and the
# Omarchy shell, which a hosted runner lacks, so it runs locally in
# `bash test/run` instead.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Model.js unit tests
        run: node test/model.test.js
      - name: settings.py tests
        run: python3 test/settings.test.py
      - name: Manifest contract
        # The Omarchy validator is skipped: hosted runners have no Omarchy.
        run: python3 test/manifest.test.py -k 'not omarchy_plugin_validate'
